name: Create signing key (run once)

on: workflow_dispatch

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate key
        run: |
          PASS=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -keystore reelkeep.jks -alias reelkeep \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Reelkeep"
          mkdir key
          cp reelkeep.jks key/
          base64 -w 0 reelkeep.jks > key/REELKEEP_KEYSTORE_BASE64.txt
          printf '%s' "$PASS" > key/REELKEEP_KEYSTORE_PASSWORD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: reelkeep-signing-key
          path: key/
          retention-days: 1