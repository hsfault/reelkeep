name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci || (rm -rf node_modules package-lock.json && npm install)
          npm run build

      - name: Bundle frontend into the app
        run: |
          rm -rf android/app/web-src
          mkdir -p android/app/web-src/web
          cp -r frontend/dist/. android/app/web-src/web/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REELKEEP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/reelkeep.jks"
            echo "REELKEEP_KEYSTORE=$RUNNER_TEMP/reelkeep.jks" >> "$GITHUB_ENV"
            echo "Using the permanent Reelkeep signing key"
          else
            echo "::warning::No signing key secret yet. This APK uses a temporary key."
          fi

      - name: Build APK
        working-directory: android
        env:
          REELKEEP_KEYSTORE_PASSWORD: ${{ secrets.REELKEEP_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/Reelkeep-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Reelkeep-${{ github.run_number }}
          path: out/*.apk
          retention-days: 14